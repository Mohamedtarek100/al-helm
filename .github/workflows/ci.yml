name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript (web app)
        run: npm run check:types

      - name: TypeScript (edge functions)
        run: npm run check:edge

      - name: i18n parity
        run: npm run test:i18n

      - name: Migration consistency
        run: npm run check:migrations

      - name: Workflow validation
        run: node scripts/check-workflows.mjs

      - name: Unit tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          # Public Supabase config only — the anon/publishable key is safe for
          # the browser bundle. No service-role or privileged secrets here.
          # Empty fallback keeps CI deterministic when the variables are not
          # configured: the app explicitly falls back to local-only mode.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || '' }}
