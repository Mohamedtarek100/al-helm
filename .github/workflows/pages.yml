name: Deploy 4uLife web build to al-helm-app (GitHub Pages)

# Builds the validated source from this repository and publishes the
# generated dist/ to the public distribution repository
# (Mohamedtarek100/al-helm-app), which serves
# https://mohamedtarek100.github.io/al-helm-app/
#
# Required repository configuration (source repo Settings):
#   Variables:
#     VITE_SUPABASE_URL      — public Supabase project URL
#     VITE_SUPABASE_ANON_KEY — public publishable/anon key (browser-safe only)
#   Secrets:
#     GH_PAGES_DEPLOY_TOKEN — PAT with contents:write on
#         Mohamedtarek100/al-helm-app. Never printed or hardcoded.
#
# The public site URL includes /al-helm-app/, so the build base path is
# fixed to that directory regardless of which repository runs the build.

on:
  push:
    # `master` is the branch development actually happens on (it was the
    # checked-out branch for every change in this release). `main` still exists
    # on the remote at the same commit and is kept so a future branch rename or
    # a manual push to either branch still deploys. Both point at the same tree
    # today; this only removes the "pushed to master, nothing deployed" gap.
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gates
        run: |
          npm run check:types
          npm run check:edge
          npm run test:i18n
          npm run test
          npm run lint
          npm run check:migrations
          node scripts/check-workflows.mjs

      - name: Verify required repository variables
        # Fail fast — never publish a bundle built without the public Supabase
        # configuration. Vars must be set in the source repo (Settings →
        # Secrets and variables → Actions → Variables tab).
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY repo variables. Set them before deploying."
            exit 1
          fi
          echo "Public Supabase configuration present (values not printed)."

      - name: Build
        env:
          # The public URL lives under /al-helm-app/ even though this workflow
          # runs in the source repository.
          VITE_BASE_PATH: /al-helm-app/
          # Public publishable configuration only — never the service-role key.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Verify deploy token availability
        # Fail safely with a clear message instead of a cryptic git error.
        env:
          GH_PAGES_DEPLOY_TOKEN: ${{ secrets.GH_PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_PAGES_DEPLOY_TOKEN" ]; then
            echo "::error::GH_PAGES_DEPLOY_TOKEN secret is not configured. Add a PAT with contents:write on Mohamedtarek100/al-helm-app, then re-run."
            exit 1
          fi

      - name: Deploy dist to al-helm-app
        # Pushes only the generated dist/ contents to the distribution
        # repository's main branch. Token comes from GH_PAGES_DEPLOY_TOKEN.
        env:
          GH_PAGES_DEPLOY_TOKEN: ${{ secrets.GH_PAGES_DEPLOY_TOKEN }}
        run: |
          git config --global user.name "4uLife deploy bot"
          git config --global user.email "actions@users.noreply.github.com"
          git clone --depth 1 --branch main \
            "https://x-access-token:${GH_PAGES_DEPLOY_TOKEN}@github.com/Mohamedtarek100/al-helm-app.git" publish
          cd publish
          # Replace published files but keep repository metadata (README, LICENSE).
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'README.md' ! -name 'LICENSE' -exec rm -rf {} +
          cp -r ../dist/* .
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Deploy build from al-helm@${GITHUB_SHA}"
            git push origin main
          fi
